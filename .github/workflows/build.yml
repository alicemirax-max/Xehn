name: Build APK

# Builds the Go engine into an AAR, then assembles the app.
#
# Why CI at all: gomobile needs the Android NDK, whose Linux toolchain is x86_64
# only. On an arm64 host the linker cannot run. GitHub's runners are x86_64, so
# this is the supported place to do it.
#
# Triggers: push to main, any pull request, or manual dispatch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.23.x"
  JAVA_VERSION: "17"
  NDK_VERSION: "27.2.12479018"
  CMDLINE_TOOLS: "11076708"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: engine/go.sum

      # The marketplace SDK action proved unreliable on this runner image, so the
      # command-line tools are installed directly. This is the documented
      # bootstrap: unzip, accept licenses, install what we need.
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS}_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept licenses and install packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gomobile init

      - name: Verify engine
        working-directory: engine
        run: |
          go vet ./...
          go test ./... -count=1

      - name: Build engine as Android library
        working-directory: engine
        run: |
          # -javapkg pins the generated package so Kotlin imports are stable:
          #   trail.tun.go.Mobile
          # Without it gomobile uses a path derived from the module name, which
          # changes whenever the module is renamed.
          gomobile bind \
            -target=android/arm64 \
            -androidapi=24 \
            -javapkg=trail.tun.go \
            -o ../app/app/libs/tuntrail.aar \
            ./mobile

      - name: Show generated bindings
        # The Java package gomobile picks is not obvious, and guessing it cost a
        # build. Print the class list so the next failure shows the truth.
        run: |
          unzip -o -q app/app/libs/tuntrail.aar -d /tmp/aar
          echo "--- classes.jar contents:"
          unzip -l /tmp/aar/classes.jar | awk '{print $4}' | grep -E '^go/|^trail/|\.class$' | head -40 || true

      - name: Assemble debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tuntrail-debug
          path: app/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
